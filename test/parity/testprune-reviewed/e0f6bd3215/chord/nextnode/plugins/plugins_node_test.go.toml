[[entry]]
path = "chord/nextnode/plugins/plugins_node_test.go"
commit = "e0f6bd3215"
class = "NOBEHAVIOR"
cite = ""
reason = "The commit's Pi-Behavior-Change trailer cites packages/chord/src/next-node/workers/main.ts:114, Pi's eager `new ParentLink(ipcLink(...))`, and Pi did not change that line: it is the line the Node host departs from. No Pi line governs the expectation change. The Node host connects its parent link at the first use of NodeHost.Link (an additive Go integration of the Node subprocess, not Pi behavior), so a host nothing attaches has no heartbeat and stays alive until Close, where the tests expected the heartbeat to end it. The tests' expectations moved to that behavior, and the test that pins it is headed \"Not Pi's\"."
