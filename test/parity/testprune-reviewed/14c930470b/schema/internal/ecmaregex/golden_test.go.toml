reason = "ecmaregex is the ECMAScript regular-expression engine PiG needs under packages/schema/src/shared.ts and formats/typebox/regex.ts; V8 is the oracle and no Pi test line governs it. The commit extends the golden replay, not any Pi behavior: it also compares V8's SyntaxError message of every invalid row, reads the golden's match results from a packed bit string, decodes lone surrogates as WTF-8, skips the pinned known gaps, and names the Go and Unicode versions in every failure. The expected values that changed are the golden's row format and counts, regenerated under Node 24.22.1."
