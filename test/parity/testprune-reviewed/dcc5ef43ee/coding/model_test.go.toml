reason = "Pi adc5fa9f80 and 04a93bad8f make the session's client identity carry the attribution only while install telemetry is enabled (client-identity.ts:14: `attribution: isInstallTelemetryEnabled(settingsManager) ? PI_ATTRIBUTION : null`) and apply it through the ai package's request options (identity.ts:107, getAttributionHeaders) instead of a provider wrapper of the coding package: the model's provider type is the request-options provider, and the test of the install-telemetry gate on the wrapper is replaced by the identity's own gate."
