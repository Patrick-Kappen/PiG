reason = "The ported conformance suite of Pi (telemetry/src/testing/conformance.ts) names its cases \"carries adapter capabilities through contexts and spans\" (:51), \"copies instrument metadata and measurement attributes\" (:109) and \"links / ignores links added after source settlement\" (:149) where PiG's older suite had \"copies inputs and suppresses invalid measurements atomically\" and \"suppresses malformed links atomically and ignores settled sources\", so the lists of the cases each broken store must fail use Pi's names and gain the capabilities case."
