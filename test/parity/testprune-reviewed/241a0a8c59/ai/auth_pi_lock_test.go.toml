cite = "packages/coding-agent/src/core/auth-storage.ts:188"
reason = "Pi withLockAsync (auth-storage.ts:188) writes the modifier's result with writeFileSync as long as its heartbeat has not reported a compromise yet, and throws only after it has (throwIfCompromised, TestAuthStorageLockCompromisedDuringModifyUpstream). The Go test that expected no write whenever the lock file had been removed inside the modifier is renamed and now expects the modifier's credential and the other providers in the file; the reported-compromise case stays an error and is covered by the upstream test."
