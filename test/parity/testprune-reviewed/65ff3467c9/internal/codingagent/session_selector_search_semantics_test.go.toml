reason = "Pi 8c03fef4d (#11220) scores a session token by the best field it matches, in tiers of a million (session-selector-search.ts:33, tierScore at :62-64): name text in tier 0 with the fuzzy score, id, message and cwd text in tier 1 (:69-72), and only scattered name or cwd characters in tier 2 (:76-85, never messages or ids). The expected scores therefore become the tiered values (1000000, 2000000, 1999988.8 ...), a scattered match over message text no longer matches, and the table passes whole SessionInfo values instead of one message text."
