cite = "packages/coding-agent/src/modes/interactive/components/session-selector-search.ts:80"
reason = "Pi 8c03fef4d (#11220) lets a scattered (fuzzy) token match only the session's name or cwd (session-selector-search.ts:80-82: `for (const field of [session.name ?? \"\", session.cwd])`), never its message text, so the relevance test that expected `lgin` to find the session whose message text holds those scattered letters expects no match, and checks `gma` against the name or directory instead."
