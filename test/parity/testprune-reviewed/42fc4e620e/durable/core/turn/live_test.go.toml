reason = "Pi f3255de7 makes endRun record `runFailure` in pi.live when a run ends without an answer (live.ts:179-212) and keeps it until a later run starts: the core's EndRun, and the run ends of its generation, now leave `{runFailure: {taskId, inputs, reason, detail?}}` where pi.live was empty, so the turn tests expect that document after an aborted, faulted, orphaned or model-error run and after the compactions of a failed run end."
