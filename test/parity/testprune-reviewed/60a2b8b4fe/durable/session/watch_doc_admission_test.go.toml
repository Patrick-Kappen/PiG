reason = "Pi 6c2fd73b0 builds a document watch on observeCommits(), the Session's own observers that see a commit held in memory when it is adopted (session.ts:1026), where it was built on subscribeCommits(), which now sees only stored commits. The test that counted the watch's commit subscription counts its observer subscription, and asserts it holds no host subscription."
