reason = "Pi 89c921d8 replaces the Kimi login's private check with the shared trustedHttpUrl (trusted-url.ts:6-9), which takes any value and returns the normalized href of an http(s) URL or null: the table's want changes from a boolean to the returned href (`HTTPS://Example.test` becomes `https://example.test/`, a control character is percent-encoded) and gains the empty string, nil and a number, which are not trusted."
