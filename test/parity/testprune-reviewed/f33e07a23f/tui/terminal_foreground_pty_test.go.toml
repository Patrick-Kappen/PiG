reason = "The two expected values are the hung-up-terminal answer of TestStdinInForegroundFollowsTheTerminalProcessGroup, a test this unreleased branch added for D227 (Pi has no foreground check and no test of it). ENOTTY, a terminal that is not the controlling terminal, now answers foreground like Pi's unconditional restart instead of an error, so the hung-up case accepts EIO (Linux) or the no-controlling-terminal answer. No shipped Pi behavior and no existing test changed."
