reason = "Pi decodes every PNG it reads with Photon's `PhotonImage.new_from_byteslice` (image-convert.ts:11, and image-resize-core.ts, clipboard-image.ts, the durable images/index.ts), whose png crate accepts and refuses other files than Go's image/png: PNG joins the formats whose Go decoder no production code may register or call (the banned list gains image/png, so the sample of the self-test has six uses: its blank png import and its blank webp import)."
