reason = "No Pi behavior changed and no PiG behavior changed. The commit adds only the writeHighlightCode seam in write_highlight_cache.go (a variable initialised to tui.HighlightCode, used at the three places the write cache highlights code) and replaces the streaming test's assertion: it compared cached line strings by value, which cannot fail because highlighting is deterministic. It now records what the cache highlights, as Pi's test spies on its highlight function (code-highlighter.test.ts:54-71, a test file): the 60-line update highlights exactly the changed last line. The mutants that re-highlight the leading 50 lines or rebuild the whole cache on every update fail it."
