reason = "The changelog fragment tool is PiG-original CI automation with no Pi counterpart, so no Pi line governs it. The fold now refuses any fragment, legacy or not, whose \"### Fixed\" bullet has no `<!-- fix: <sha> -->` marker, so the fold tests' fixture bullets carry a marker and their expected CHANGELOG text carries it too, and a new test pins the refusal of an unmarked bullet and the acceptance of a marked one, for a legacy and a normal fragment."
