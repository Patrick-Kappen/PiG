reason = "Pi records a span's and an event's attributes as an object copied with Object.entries (memory.ts:110-115), keeping insertion order and copying array values, so PiG's SpanAttributes is an ordered list of Attr values (Set and Value replace the map index): the detached-copy test builds the attributes with Attr and reads them with Value, and expects the same copied values (n stays 1, the list keeps its first element)."
