reason = "Pi 38847563 and bdd9f039 (#11166, #9909) stack extension dialogs (interactive-mode.ts:2693-2712 pushExtensionDialog, removeExtensionDialog, showTopExtensionDialog) instead of letting a new dialog displace the open one: a dialog opened over another hides it without settling it, the new one takes the keys, and when it closes the earlier dialog shows again and stays answerable, the editor returning only when the last closes. The displacement tests (the displaced dialog stays pending until its own abort, a submitted input restores the editor) expect the stack's behavior."
