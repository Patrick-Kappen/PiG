# SPDX-License-Identifier: MIT
name: Fork sync

# Fork only (Patrick-Kappen/PiG). Brings upstream's main into the fork's main through a pull request that merges
# itself once the required checks pass (.github/fork/sync.sh):
#   upstream     MichaelKinsy/PiG main  ->  main         (sync/upstream)
# A conflict opens an issue instead, to resolve on the sync branch. Runs only by hand (Actions → Fork sync → Run
# workflow); on the upstream repository it does nothing.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Patrick-Kappen/PiG'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The release App: a pull request it opens starts CI (one opened with the workflow token would not), and it may
      # push merges that change workflow files.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      # A merge whose conflicts are all in derived files is made in this checkout (sync.sh merge_derived): git needs an
      # identity for it, and the pre-flight's `signed` check needs it signed. The committer is the fork owner, whose
      # account holds the signing key, so GitHub shows the merge Verified.
      - name: Set up signing
        env:
          FORK_SIGNING_KEY: ${{ secrets.FORK_SIGNING_KEY }}
        run: |
          if [ -z "$FORK_SIGNING_KEY" ]; then
            echo "::error::secret FORK_SIGNING_KEY is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/signing_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$FORK_SIGNING_KEY" > "$key"
          git config user.name "Patrick Kappen"
          git config user.email "patrick@kappen.io"
          git config gpg.format ssh
          git config user.signingkey "$key"
      - name: Upstream main into main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash .github/fork/sync.sh upstream MichaelKinsy/PiG main main
