# SPDX-License-Identifier: MIT

name: Light

# What every push to a pull request gets: does this change break the product? light/light.mk says what runs.
#   Fast    the tests that start no program, on one runner: every test binary built once, then one queue, the longest
#           test first (automation/light/plan -queue)
#   Lint    golangci-lint on the files the change touches
#   Light   the verdict: green when both are green. This is the one check to require.
#   Warm    on a push to main or light-next only: compiles, builds and analyses what the tests and the lint start
#           from, runs no test, and saves it.
# A pull request saves no cache: Fast and Lint restore what Warm saved.
#
# This is the light run of the branch light-next, where a pull request gets Pre-flight and this and nothing else. Not
# in it yet, and run nowhere on this branch: the tests that start a program (light/programs.txt), go vet for the
# platforms besides Linux, and the security checks.
on:
  pull_request:
  push:
    branches: [main, light-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTAINER_ENGINE: docker
  # The tests that measure wall-clock time or a speed ratio only warn: a shared runner's speed is not the change's.
  PIG_PERF_TIMING_REPORT_ONLY: '1'
  PIG_LIGHT_ENV: PIG_PERF_TIMING_REPORT_ONLY
  PIG_LIGHT_CACHE_ROOT: /home/runner/light-cache

jobs:
  # The image is named after the hash of its Containerfile, so it is built once and every later run pulls it. This job
  # is the only one that waits for nothing and that every other job waits for: with the image present it takes seconds.
  setup:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: light

      - name: Find the light image, or build and publish it
        id: image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/light:$(light/run.sh --tag)"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            light/run.sh --build "$image"
            # A pull request from another repository may not publish; its jobs then build the image themselves.
            docker push -q "$image" || echo "::warning::could not publish $image; every job of this run builds it"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # One runner: the tests that start no program, built once and run from one queue.
  fast:
    name: Fast
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the light image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.setup.outputs.image }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker pull -q "$IMAGE"; then echo "PIG_LIGHT_IMAGE=$IMAGE" >> "$GITHUB_ENV"; fi

      - name: Restore what main prepared
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIG_LIGHT_CACHE_ROOT }}
          key: light-test-${{ hashFiles('light/Containerfile') }}-${{ github.sha }}
          restore-keys: light-test-${{ hashFiles('light/Containerfile') }}-

      - name: Run the tests that start no program
        run: light/run.sh make -f light/light.mk -k -j4 light-fast

      - name: Report the seconds of each part
        if: always()
        run: |
          {
            echo '```'
            make -s -f light/light.mk light-times
            cat tmp/light/fast-report.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: light-fast
          path: |
            tmp/light/test-fast.json
            tmp/light/fast-report.txt
          retention-days: 14
          if-no-files-found: ignore

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      # Depth 2 reaches the commit the lint compares with: the base of a pull request's merge commit, or the commit before a push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pull the light image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.setup.outputs.image }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker pull -q "$IMAGE"; then echo "PIG_LIGHT_IMAGE=$IMAGE" >> "$GITHUB_ENV"; fi

      # What the Warm job of the last push to main prepared: the lint's analysis of every package as main has it. The
      # lint analyses again only the packages this change touches and the ones that import them. It only reads it.
      - name: Restore what main prepared
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIG_LIGHT_CACHE_ROOT }}
          key: light-test-${{ hashFiles('light/Containerfile') }}-${{ github.sha }}
          restore-keys: light-test-${{ hashFiles('light/Containerfile') }}-

      - name: Lint the changed files
        run: light/run.sh make -f light/light.mk light-lint LIGHT_BASE='HEAD^1'

  # On main only, and the one writer of the cache. It starts from what the previous push saved, compiles every test of
  # the light run, builds what the tests' own builds start from, analyses every package for the lint, and runs no
  # test: what a test run leaves behind (every run builds cells under new temporary paths) would grow the cache from
  # push to push.
  warm:
    name: Warm
    if: github.event_name == 'push'
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the light image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.setup.outputs.image }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker pull -q "$IMAGE"; then echo "PIG_LIGHT_IMAGE=$IMAGE" >> "$GITHUB_ENV"; fi

      - name: Restore what the previous push prepared
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIG_LIGHT_CACHE_ROOT }}
          key: light-test-${{ hashFiles('light/Containerfile') }}-${{ github.sha }}
          restore-keys: light-test-${{ hashFiles('light/Containerfile') }}-

      - name: Compile, build and analyse what the tests and the lint start from
        run: light/run.sh make -f light/light.mk -k -j2 light-warm

      - name: Save it for the pull requests
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIG_LIGHT_CACHE_ROOT }}
          key: light-test-${{ hashFiles('light/Containerfile') }}-${{ github.sha }}

  light:
    name: Light
    if: always()
    needs: [fast, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every part is green
        env:
          FAST: ${{ needs.fast.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "fast: $FAST, lint: $LINT"
          [ "$FAST" = success ] && [ "$LINT" = success ]
